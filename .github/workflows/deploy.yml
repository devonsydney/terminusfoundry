# Build the Eleventy site and publish it to GitHub Pages on every push to main.
# No secrets: the deploy uses the workflow's own OIDC token (id-token: write).
# Prerequisite, done once by Devon in the GitHub UI: Settings > Pages > Source = GitHub Actions.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: bash scripts/check-output.sh
      - uses: actions/configure-pages@v6
      # v4 and later leave out hidden files; the site's only ones (.nojekyll, static/.gitkeep) are not needed with an Actions deploy.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
